name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: for f in $(find src test -name '*.js' 2>/dev/null); do node --check "$f"; done
      - name: Tests
        run: npm test --if-present
